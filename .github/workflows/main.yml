name: Kernel Build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      
    - name: Debug workflow version
      run: |
        echo "=== WORKFLOW DEBUG INFO ==="
        echo "Timestamp: $(date)"
        echo "Current directory: $(pwd)"
        echo "Directory contents:"
        ls -la
        echo "========================="
        
    - name: Fix git ownership issues
      run: |
        git config --global --add safe.directory /github/workspace
        git config --global --add safe.directory '*'
        
    - name: Set up MemKernel as a module (M) with specified name
      run: |
        echo "[+] Starting MemKernel setup..."
        
        # Clone MemKernel repository
        git clone https://github.com/Poko-Apps/MemKernel
        echo "[+] MemKernel cloned"
        
        # Determine drivers directory
        if [ -d "drivers" ]; then
          DRIVER_DIR="drivers"
        else
          echo "[ERROR] drivers directory not found"
          exit 1
        fi
        
        echo "[+] Using driver directory: $DRIVER_DIR"
        
        # Clean up any existing references
        if [ -f "$DRIVER_DIR/Kconfig" ]; then
          sed -i '/drivers\/memkernel\/Kconfig/d' "$DRIVER_DIR/Kconfig"
        fi
        if [ -f "$DRIVER_DIR/Makefile" ]; then
          sed -i '/memkernel/d' "$DRIVER_DIR/Makefile" 
        fi
        if [ -L "$DRIVER_DIR/memkernel" ]; then
          rm "$DRIVER_DIR/memkernel"
        fi
        
        # Create symlink
        ln -sf "$(pwd)/MemKernel/kernel" "$DRIVER_DIR/memkernel"
        
        # Verify
        if [ -f "$DRIVER_DIR/memkernel/Kconfig" ]; then
          echo "[+] MemKernel files accessible"
        else
          echo "[ERROR] MemKernel setup failed"
          exit 1
        fi
        
        # Add to Kconfig and Makefile
        echo "source \"drivers/memkernel/Kconfig\"" >> "$DRIVER_DIR/Kconfig"
        echo "obj-m += memkernel/" >> "$DRIVER_DIR/Makefile"
        
        # Customize module
        sed -i 's/default y/default m/' "MemKernel/kernel/Kconfig"
        sed -i "s/#define DEVICE_NAME \".*\"/#define DEVICE_NAME \"dogi\"/" "MemKernel/kernel/entry.c"
        sed -i "s/memkernel.o/dogi_memk.o/" "MemKernel/kernel/Makefile"
        sed -i "s/memkernel-y/dogi_memk-y/" "MemKernel/kernel/Makefile"
        
        echo "[+] MemKernel setup complete"
        
    - name: Android kernel build
      uses: lemniskett/android-kernel-actions@master
      id: build
      env:
        NAME: Loganysl
      with:
        arch: arm64
        compiler: clang/14
        defconfig: pipa_defconfig
        image: Image.gz-dtb
        
    - name: Upload Kernel and Module
      uses: actions/upload-artifact@v4
      with:
        name: moduleandkernel
        path: |
          ${{ steps.build.outputs.outfile }}
          ./out/drivers/memkernel/dogi_memk.ko
